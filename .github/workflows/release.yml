name: Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Build wheel
      run: uv build --wheel

    - name: Upload wheel
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-wheel
        path: dist/*.whl
        if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Build source distribution
      run: uv build --sdist

    - name: Upload source distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  lint-dist:
    runs-on: ubuntu-latest
    needs:
    - build-wheel
    - build-sdist
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Rebuild wheel from source distribution
      run: uv build dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/from-sdist"

    - name: Verify distribution file policy
      run: python scripts/check_distribution.py dist "$RUNNER_TEMP/from-sdist"

    - name: Verify wheel install
      run: |
        uv venv .venv-install-whl
        source .venv-install-whl/bin/activate
        uv pip install dist/*.whl

    - name: Verify source install
      run: |
        uv venv .venv-install-tar
        source .venv-install-tar/bin/activate
        uv pip install dist/*.tar.gz

    - name: Check package metadata
      run: uvx twine check dist/*

    - name: Check distribution contents
      run: uvx pydistcheck --inspect dist/*

    - name: Check source metadata
      run: uvx pyroma dist/*.tar.gz

    - name: Check wheel contents
      run: uvx check-wheel-contents dist/*.whl

    - name: Check source manifest
      run: uvx check-manifest -v
